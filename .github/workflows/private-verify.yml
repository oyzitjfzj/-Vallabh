name: Private exact-SHA verification

on:
  push:
    branches:
      - "feat/verification-relay-v2"
      - "verify/request"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character private commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-verify-${{ github.event_name }}-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: false

jobs:
  relay-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout relay only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate relay scripts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_validate_input.sh
          bash tests/test_checkout_contract.sh
          bash tests/test_verifier_privacy_contract.sh
          bash tests/test_target_resolution.sh
          bash tests/test_workflow_security_contract.sh

      - name: Prove missing credential fails closed
        shell: bash
        run: |
          set -euo pipefail
          valid_sha=0123456789abcdef0123456789abcdef01234567
          set +e
          TARGET_SHA="$valid_sha" PRIVATE_READ_TOKEN='' RUNNER_TEMP="$RUNNER_TEMP/missing-secret" \
            bash scripts/checkout-private.sh >"$RUNNER_TEMP/missing-secret.out" 2>&1
          status=$?
          set -e
          test "$status" -eq 65
          grep -Fxq 'VERIFY_ACCESS_MISSING_CREDENTIAL' "$RUNNER_TEMP/missing-secret.out"
          if grep -Fq 'oyzitjfzj/ai-product-web' "$RUNNER_TEMP/missing-secret.out"; then
            echo 'VERIFY_PRIVACY_FAILURE' >&2
            exit 1
          fi

  verify:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/verify/request'
    needs: relay-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout relay only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve verification target
        shell: bash
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target="$(
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            INPUT_TARGET_SHA="$INPUT_TARGET_SHA" \
            TARGET_FILE="verification-target.sha" \
            scripts/resolve-target.sh
          )"
          printf 'TARGET_SHA=%s\n' "$target" >> "$GITHUB_ENV"

      - name: Validate immutable target
        shell: bash
        run: bash scripts/validate-input.sh "$TARGET_SHA"

      - name: Exact private checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-private.sh

      - name: Canonical private verification
        shell: bash
        run: bash scripts/run-private-verifier.sh
