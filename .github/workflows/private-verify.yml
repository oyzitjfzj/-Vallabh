name: Private exact-SHA verification

on:
  push:
    branches:
      - "feat/**"
      - "verify/request"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character private commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-verify-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      PRIVATE_REPOSITORY: oyzitjfzj/ai-product-web
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve verification target
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/verify/request'
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${{ inputs.target_sha }}"
          else
            target="$(tr -d '[:space:]' < verification-target.sha)"
          fi
          printf 'TARGET_SHA=%s\n' "$target" >> "$GITHUB_ENV"

      - name: Validate immutable target
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/verify/request'
        shell: bash
        run: bash scripts/validate-input.sh "$TARGET_SHA"

      - name: Relay self-test
        shell: bash
        run: bash tests/test_validate_input.sh

      - name: Exact private checkout
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/verify/request'
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-private.sh

      - name: Canonical private verification
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/verify/request'
        shell: bash
        run: bash scripts/run-private-verifier.sh
