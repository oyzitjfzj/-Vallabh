name: Encrypted private rustfmt diagnostic
# rerun: capture-cargo-lock-task8
# rerun: launch-metadata-rustfmt-946f17e

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-encrypted-fmt.yml"

permissions:
  contents: read

concurrency:
  group: encrypted-private-rustfmt
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current private work snapshot
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_TOKEN"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/oyzitjfzj/ai-product-web.git"

          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          log="$RUNNER_TEMP/private-checkout.log"
          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin refs/heads/feat/site-core-release >"$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "FMT_DIAG_PRIVATE_CHECKOUT=FAIL"
            exit 1
          fi

          git checkout -q --detach FETCH_HEAD >"$log" 2>&1
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          printf '%s' "$actual" > "$RUNNER_TEMP/private_snapshot_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          echo "FMT_DIAG_SNAPSHOT_PROOF=$proof"
          unset PRIVATE_TOKEN auth

      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          echo "FMT_DIAG_TOOLCHAIN=READY"

      - name: Build encrypted formatting patch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bundle="$RUNNER_TEMP/fmt-bundle"
          mkdir -p "$bundle"

          set +e
          cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1
          before_rc=$?
          set -e

          cargo +1.98.1 fmt --all >/dev/null
          cargo +1.98.1 fmt --all -- --check >/dev/null
          git diff --check >/dev/null
          git diff --binary -- '*.rs' > "$bundle/rustfmt.diff"
          git diff --name-only -- '*.rs' > "$bundle/rustfmt-paths.txt"
          cp "$RUNNER_TEMP/private_snapshot_sha" "$bundle/snapshot-sha.txt"

          count="$(wc -l < "$bundle/rustfmt-paths.txt" | tr -d ' ')"
          echo "FMT_DIAG_CHECK_BEFORE_RC=$before_rc"
          echo "FMT_DIAG_CHANGED_COUNT=$count"

          set +e
          cargo +1.98.1 clippy --workspace --all-targets -- -D warnings >"$bundle/clippy.log" 2>&1
          clippy_rc=$?
          set -e
          printf '%s\n' "$clippy_rc" > "$bundle/clippy.rc"
          echo "FMT_DIAG_CLIPPY_RC=$clippy_rc"

          test -f Cargo.lock
          cp Cargo.lock "$bundle/Cargo.lock"
          lock_proof="$(sha256sum Cargo.lock | awk '{print $1}')"
          echo "FMT_DIAG_LOCKFILE_PROOF=$lock_proof"

          cat > "$RUNNER_TEMP/recipient-cert.pem" <<'EOF_CERT'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUeshfCBBmMnQjXY3mVFSP/Xf9wPUwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkVmFsbGFiaCBFcGhlbWVyYWwgUnVzdGZtdCBEaWFnbm9z
          dGljMB4XDTI2MDkyMzAxMzg1MVoXDTI2MDkyNTAxMzg1MVowLzEtMCsGA1UEAwwk
          VmFsbGFiaCBFcGhlbWVyYWwgUnVzdGZtdCBEaWFnbm9zdGljMIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEA8wbtuZIn4d3VWkrOl9ut/yJ09HJY+VuxR79a
          oto7vN9Gd0sV6RjVpkz9o8HEI+gvzcCegGSZcfQRfBsJnI4PNxRkilRy2n1rv/IZ
          KnqR/P/MfGDCzcIPlUhqQlWEa6cw0IjCun3Tclp9+sN7WTaMzxZRGslD7wAXT8h2
          yxotS6NbKjhRiaws5QNpvYSTkvzGXk5EZz/3JYQlhuLi2XuINmttrfOeOlS3N6jg
          4Z5NMMAtQG9glOBglZQjYUnXRvoMYpX+ZKfDflCU+e9T36dGKJxE03bFiiVN00xt
          VSiLJik1X88pbYcYT0ifI/cfdlhAXwNRnvHzz6v0/U0DNugviEowF6nWHuBPXvVi
          3ACKrRDs7jNQ9EClOYXbjU3MWRdM3tODGaa95G2ckPPYJMnOMR4KO0jJbdOkp00X
          hcy/5ZGEauBcT/AIUgyKVySEUXfli1V9rsdDjR+0vzXq62pm/xvHaEwVmNQlrXFR
          Vyy4yIqVgoHJkFJnE30ZPXyOG54rAgMBAAGjUzBRMB0GA1UdDgQWBBRbTmCbJBT0
          dNodGlBz9R9mgOY5xTAfBgNVHSMEGDAWgBRbTmCbJBT0dNodGlBz9R9mgOY5xTAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQDCyXMEAzLidwGdsyRa
          2ilOXuqZj7vHFj30EhJnc+/mT03HfubLDdOgO6SxCf1odXn5+oSryre5zDBxVJJF
