          EOF_CERT

          fp="$(openssl x509 -in "$RUNNER_TEMP/recipient-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "C2:C2:C9:8E:CE:62:97:8B:61:9B:95:F8:4D:A3:40:2B:6E:EE:4A:8C:C0:20:68:A8:FE:70:9E:4F:EA:10:4C:D0"
          tar -C "$bundle" -czf "$RUNNER_TEMP/private-fmt.tgz" .
          openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -in "$RUNNER_TEMP/private-fmt.tgz" \
            -out "$RUNNER_TEMP/encrypted-fmt.cms" \
            "$RUNNER_TEMP/recipient-cert.pem"

          rm -rf "$bundle" "$RUNNER_TEMP/private-fmt.tgz" "$RUNNER_TEMP/recipient-cert.pem"
          echo "FMT_DIAG_CIPHERTEXT_READY=YES"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-private-rustfmt
          path: ${{ runner.temp }}/encrypted-fmt.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
