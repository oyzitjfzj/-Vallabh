name: Encrypted rustfmt diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-diagnostic.yml
      - ci/diagnostic-cert.pem
      - ci/diagnostic-trigger
      - tests/test_format_diagnostic_contract.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vallabh-rustfmt-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Self-test diagnostic contract
        shell: bash
        run: bash tests/test_format_diagnostic_contract.sh

      - name: Resolve exact private branch head
        id: target
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          PRIVATE_REPOSITORY="oyzitjfzj/ai-product-web"
          PRIVATE_BRANCH="feat/site-core-release"
          if [[ -z "$PRIVATE_READ_TOKEN" ]]; then
            echo "VALLABH_DIAG_ACCESS_MISSING" >&2
            exit 65
          fi
          log="$RUNNER_TEMP/resolve-private-head.log"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 | tr -d '\n')"
          if ! target="$(GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=never git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote "https://github.com/${PRIVATE_REPOSITORY}.git" "refs/heads/${PRIVATE_BRANCH}" \
            2>"$log" | awk '{print $1}')"; then
            echo "VALLABH_DIAG_RESOLVE_FAILED" >&2
            exit 66
          fi
          unset auth PRIVATE_READ_TOKEN
          bash scripts/validate-input.sh "$target"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "VALLABH_DIAG_TARGET=$target"

      - name: Exact private checkout
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-private.sh

      - name: Install canonical rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/rustup.log" 2>&1
          echo "VALLABH_DIAG_RUSTFMT=1.98.1"

      - name: Produce encrypted formatting patch
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-source"
          patch="$RUNNER_TEMP/rustfmt.patch"
          cipher="$RUNNER_TEMP/rustfmt.patch.cms"
          names="$RUNNER_TEMP/rustfmt.changed"
          cd "$root"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "VALLABH_DIAG_IDENTITY_MISMATCH" >&2
            exit 67
          fi
          RUSTUP_TOOLCHAIN=1.98.1 cargo fmt --all >"$RUNNER_TEMP/rustfmt.log" 2>&1
          git diff --name-only >"$names"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              *.rs) ;;
              *) echo "VALLABH_DIAG_SCOPE_VIOLATION" >&2; exit 68 ;;
            esac
          done <"$names"
          git diff --binary -- '*.rs' >"$patch"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$patch" \
            -outform DER \
            -out "$cipher" \
            "$GITHUB_WORKSPACE/ci/diagnostic-cert.pem"
          if [[ -s "$patch" ]]; then
            echo "VALLABH_FMT_PATCH=READY"
          else
            echo "VALLABH_FMT_PATCH=EMPTY"
          fi

      - name: Upload encrypted patch only
        uses: actions/upload-artifact@v4
        with:
          name: vallabh-rustfmt-ciphertext
          path: ${{ runner.temp }}/rustfmt.patch.cms
          if-no-files-found: error
          retention-days: 1
