name: Public-safe visual qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-visual-qualify.yml"
      - "RUN_VISUAL"

permissions:
  contents: read

concurrency:
  group: vallabh-public-safe-visual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout relay only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private main snapshot
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_TOKEN"

          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/oyzitjfzj/ai-product-web.git"

          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          log="$RUNNER_TEMP/private-checkout.log"

          set +e
          git -c http.extraHeader="AUTHORIZATION: basic $auth"             fetch -q --depth=1 origin refs/heads/main >"$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "VISUAL_PRIVATE_CHECKOUT=FAIL"
            exit 1
          fi

          git checkout -q --detach FETCH_HEAD >"$log" 2>&1
          sha="$(git rev-parse HEAD)"
          echo "VISUAL_PRIVATE_SHA=$sha"
          unset PRIVATE_TOKEN auth

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update >"$RUNNER_TEMP/rustup.log" 2>&1
          echo "VISUAL_TOOLCHAIN=rust-1.98.1"

      - name: Build public-safe site output
        shell: bash
        run: |
          set -euo pipefail
          cd target
          if ! RUSTUP_TOOLCHAIN=1.98.1 bash scripts/build-release.sh >"$RUNNER_TEMP/site-build.log" 2>&1; then
            echo "VISUAL_BUILD=FAIL"
            exit 1
          fi
          echo "VISUAL_BUILD=PASS"

      - name: Capture desktop and mobile renders
        shell: bash
        run: |
          set -euo pipefail
          browser=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$browser" ]]; then
            echo "VISUAL_BROWSER_MISSING"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/visual"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory target/dist >"$RUNNER_TEMP/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          capture() {
            local name="$1"
            local size="$2"
            local url="$3"
            "$browser"               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --hide-scrollbars               --window-size="$size"               --screenshot="$RUNNER_TEMP/visual/$name.png"               "$url" >"$RUNNER_TEMP/$name.chrome.log" 2>&1
            test -s "$RUNNER_TEMP/visual/$name.png"
          }

          capture home-desktop "1440,5000" "http://127.0.0.1:4173/"
          capture home-mobile "390,7200" "http://127.0.0.1:4173/"
          capture product-desktop "1440,3600" "http://127.0.0.1:4173/product/"
          capture product-mobile "390,5000" "http://127.0.0.1:4173/product/"
          capture download-desktop "1440,2600" "http://127.0.0.1:4173/download/"
          capture download-mobile "390,3600" "http://127.0.0.1:4173/download/"

          echo "VISUAL_CAPTURE=PASS"
          sha256sum "$RUNNER_TEMP"/visual/*.png | sed 's#'"$RUNNER_TEMP"'/visual/##'

      - name: Upload screenshots only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-safe-site-renders
          path: ${{ runner.temp }}/visual/*.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
